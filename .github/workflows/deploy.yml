name: Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
        run: |
          set -e
          mkdir -p ~/.ssh
          if [ -n "$DEPLOY_SSH_KEY_B64" ]; then
            echo "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          elif [ -n "$DEPLOY_SSH_KEY" ]; then
            printf "%s" "$DEPLOY_SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          else
            echo "No SSH key secret configured (DEPLOY_SSH_KEY or DEPLOY_SSH_KEY_B64)." >&2
            exit 1
          fi
          chmod 600 ~/.ssh/deploy_key
          eval "$(ssh-agent -s)"
          ssh-add ~/.ssh/deploy_key

      - name: Add server to known_hosts
        run: ssh-keyscan -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload project to server
        run: |
          rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude ".next" \
            --exclude "node_modules" \
            --exclude ".env.local" \
            --exclude ".DS_Store" \
            -e "ssh -p ${{ secrets.DEPLOY_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/macmagia/"

      - name: Inject payment env vars on server
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/deploy_key \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "ENV=~/macmagia/.env.local; touch \$ENV; \
             grep -v '^NEXT_PUBLIC_SITE_URL=\|^YOOKASSA_\|^SMTP_\|^UNISENDER_\|^DELIVERY_' \$ENV > /tmp/_env.tmp && mv /tmp/_env.tmp \$ENV; \
             echo 'NEXT_PUBLIC_SITE_URL=https://macmagia.ru' >> \$ENV; \
             echo 'YOOKASSA_SHOP_ID=${{ secrets.YOOKASSA_SHOP_ID }}' >> \$ENV; \
             echo 'YOOKASSA_SECRET_KEY=${{ secrets.YOOKASSA_SECRET_KEY }}' >> \$ENV; \
             echo 'SMTP_HOST=smtp.yandex.ru' >> \$ENV; \
             echo 'SMTP_PORT=465' >> \$ENV; \
             echo 'SMTP_USER=${{ secrets.SMTP_USER }}' >> \$ENV; \
             echo 'SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}' >> \$ENV; \
             echo 'DELIVERY_FROM_EMAIL=${{ secrets.DELIVERY_FROM_EMAIL }}' >> \$ENV; \
             echo 'DELIVERY_FROM_NAME=MacMagia' >> \$ENV"

      - name: Install, build and restart app
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" <<'EOF'
            set -e
            cd ~/macmagia
            npm install
            npm run build
            pm2 restart macmagia --update-env || pm2 start npm --name macmagia -- start
            pm2 save
          EOF

      - name: Remove nginx redirect / → /cards|/mac (if sudo NOPASS for deploy user)
        continue-on-error: true
        run: |
          ssh -p "${{ secrets.DEPLOY_PORT }}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'if [ -f "$HOME/macmagia/deploy/remove-nginx-root-redirect.sh" ]; then bash "$HOME/macmagia/deploy/remove-nginx-root-redirect.sh" || echo "Nginx fix failed (add NOPASSWD sudo for this user, or run the script on the server by hand)."; else echo "Nginx fix script not found."; fi'
